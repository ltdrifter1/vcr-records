<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Artists — VCR Recordings</title>
  <meta name="description" content="VCR Recordings artists."/>
  <meta name="theme-color" content="#f5f5f7"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/player.css"/>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --dim: #86868b;
      --line: rgba(0,0,0,.08);
      --fill: rgba(0,0,0,.04);
      --fill-hi: rgba(0,0,0,.07);
      --shadow: 0 2px 16px rgba(0,0,0,.05);
      --shadow-lg: 0 18px 50px rgba(0,0,0,.09);
      --radius: 22px;
      --pill: 980px;
      --ease: cubic-bezier(.25,.1,.25,1);
      --dur: 300ms;
      --sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --wrap: 1080px;
      --nav-h: 56px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      font-size: 17px;
      line-height: 1.47;
      letter-spacing: -.01em;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    button {
      font-family: inherit; cursor: pointer; border: none; background: none;
      -webkit-tap-highlight-color: transparent;
    }
    ::selection { background: rgba(0,0,0,.12); }

    body::before {
      content: "";
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(900px 480px at 12% -10%, rgba(255,255,255,.95), transparent 60%),
        radial-gradient(700px 420px at 88% 8%, rgba(210,220,230,.45), transparent 55%),
        linear-gradient(180deg, #eef0f4 0%, var(--bg) 38%, var(--bg) 100%);
    }

    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 300;
      height: calc(var(--nav-h) + var(--safe-t));
      padding-top: var(--safe-t);
      background: rgba(245,245,247,.82);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid transparent;
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    .nav.scrolled {
      background: rgba(255,255,255,.9);
      border-bottom-color: var(--line);
    }
    .nav-inner {
      max-width: var(--wrap);
      margin: 0 auto;
      height: var(--nav-h);
      padding: 0 22px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .nav-logo img { height: 48px; width: auto; }
    @media (hover:hover) { .nav-logo:hover { opacity: .65; } }
    .nav-links { display: flex; gap: 2px; }
    .nav-links a {
      padding: 8px 12px;
      font-size: 12px; font-weight: 500;
      color: var(--muted);
      border-radius: var(--pill);
      transition: color var(--dur) var(--ease), background var(--dur) var(--ease);
    }
    .nav-links a[aria-current="page"] { color: var(--text); background: var(--fill-hi); }
    @media (hover:hover) {
      .nav-links a:hover { color: var(--text); background: var(--fill-hi); }
    }

    .nav-end { display: flex; align-items: center; gap: 4px; }
    .nav-cart {
      position: relative; width: 42px; height: 42px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--pill); color: var(--text);
      transition: background var(--dur) var(--ease);
    }
    @media (hover:hover) { .nav-cart:hover { background: var(--fill-hi); } }
    .nav-cart svg { width: 20px; height: 20px; }
    .nav-cart-count {
      position: absolute; top: 4px; right: 2px;
      min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: var(--pill); background: var(--text); color: #fff;
      font-size: 10px; font-weight: 700; line-height: 18px; text-align: center;
    }
    .nav-ham { display: none; flex-direction: column; gap: 5px; padding: 10px; }
    .nav-ham span {
      display: block; width: 16px; height: 1.5px; background: var(--muted);
      transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
    }
    .nav-ham.on span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); background: var(--text); }
    .nav-ham.on span:nth-child(2) { opacity: 0; }
    .nav-ham.on span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); background: var(--text); }
    @media (max-width: 680px) { .nav-links { display: none; } .nav-ham { display: flex; } }
    .nav-drawer {
      display: none; position: fixed;
      top: calc(var(--nav-h) + var(--safe-t)); left: 0; right: 0; z-index: 290;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
      padding: 8px 22px calc(16px + var(--safe-b));
    }
    .nav-drawer.on { display: block; }
    .nav-drawer a {
      display: block; padding: 14px 0;
      border-bottom: 1px solid var(--line);
      font-size: 15px; font-weight: 500; color: var(--muted);
    }
    .nav-drawer a:last-child { border-bottom: none; }
    .nav-drawer a[aria-current="page"] { color: var(--text); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 44px; padding: 0 22px;
      border-radius: var(--pill);
      font-size: 14px; font-weight: 500;
      transition: opacity var(--dur) var(--ease), transform 180ms var(--ease), background var(--dur) var(--ease);
    }
    .btn:active { transform: scale(.97); }
    .btn-dark { background: #1d1d1f; color: #fff; }
    .btn-ghost { background: var(--fill-hi); color: var(--text); }
    @media (hover:hover) {
      .btn-dark:hover { opacity: .86; }
      .btn-ghost:hover { background: rgba(0,0,0,.1); }
    }

    .page {
      padding-top: calc(var(--nav-h) + var(--safe-t));
      min-height: 100vh;
    }
    .band {
      max-width: var(--wrap);
      margin: 0 auto;
      padding: 0 22px;
    }

    .intro {
      padding: 72px 0 28px;
      max-width: 720px;
    }
    @media (min-width: 800px) { .intro { padding: 96px 0 40px; } }
    .intro-brand {
      font-size: 12px; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase;
      color: var(--dim); margin-bottom: 18px;
    }
    .intro h1 {
      font-size: clamp(42px, 8vw, 72px);
      font-weight: 700;
      letter-spacing: -.045em;
      line-height: 1.02;
      margin-bottom: 18px;
    }
    .intro p {
      font-size: clamp(17px, 2.2vw, 21px);
      color: var(--muted);
      max-width: 34em;
      line-height: 1.45;
    }

    .roster { padding: 24px 0 100px; display: flex; flex-direction: column; gap: 28px; }
    @media (min-width: 800px) { .roster { gap: 36px; padding-bottom: 120px; } }

    .artist {
      display: grid;
      grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr);
      gap: 0;
      background: var(--surface);
      border-radius: calc(var(--radius) + 6px);
      overflow: hidden;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .7s var(--ease), transform .7s var(--ease), box-shadow .4s var(--ease);
    }
    .artist.in { opacity: 1; transform: none; }
    .artist:nth-child(2) { transition-delay: .08s; }
    .artist:nth-child(3) { transition-delay: .16s; }
    @media (hover:hover) {
      .artist:hover { box-shadow: var(--shadow-lg); }
      .artist:hover .artist-visual img { transform: scale(1.04); }
    }
    @media (max-width: 820px) {
      .artist { grid-template-columns: 1fr; }
    }
    .artist-visual {
      position: relative;
      min-height: 320px;
      background: #e8e8ed;
      overflow: hidden;
    }
    @media (min-width: 821px) {
      .artist-visual { min-height: 100%; }
      .artist:nth-child(even) .artist-visual { order: 2; }
    }
    .artist-visual img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 1s var(--ease);
    }
    .artist-visual::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.18));
      pointer-events: none;
    }
    .artist-body {
      padding: 36px 28px 32px;
      display: flex; flex-direction: column; justify-content: center; gap: 18px;
    }
    @media (min-width: 800px) {
      .artist-body { padding: 48px 44px; gap: 22px; }
    }
    .artist-role {
      font-size: 12px; font-weight: 600;
      letter-spacing: .12em; text-transform: uppercase;
      color: var(--dim);
    }
    .artist-name {
      font-size: clamp(32px, 5vw, 44px);
      font-weight: 700;
      letter-spacing: -.04em;
      line-height: 1.05;
    }
    .artist-bio {
      font-size: 16px;
      color: var(--muted);
      max-width: 36em;
      line-height: 1.55;
    }
    .artist-releases {
      display: flex; flex-wrap: wrap; gap: 10px;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 8px 12px 8px 8px;
      border-radius: var(--pill);
      background: var(--fill);
      transition: background var(--dur) var(--ease);
    }
    @media (hover:hover) { .chip:hover { background: var(--fill-hi); } }
    .chip img {
      width: 36px; height: 36px;
      border-radius: 8px;
      object-fit: cover;
      background: #e8e8ed;
    }
    .chip span {
      font-size: 13px; font-weight: 600;
      letter-spacing: -.01em;
      padding-right: 4px;
    }
    .artist-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }

    .footer {
      background: #fff;
      border-top: 1px solid var(--line);
      padding: 48px 0 calc(28px + var(--safe-b));
    }
    .footer-bottom {
      display: flex; flex-wrap: wrap; gap: 16px;
      justify-content: space-between; align-items: center;
    }
    .footer-copy { font-size: 13px; color: var(--dim); }
    .footer-links { display: flex; flex-wrap: wrap; gap: 16px; }
    .footer-links a {
      font-size: 13px; font-weight: 500; color: var(--muted);
      transition: color var(--dur) var(--ease);
    }
    @media (hover:hover) { .footer-links a:hover { color: var(--text); } }

    @media (prefers-reduced-motion: reduce) {
      .artist { opacity: 1; transform: none; transition: none; }
      .artist-visual img { transition: none; }
    }
  </style>
</head>
<body>
<header class="nav" id="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo" aria-label="VCR Records home">
      <img src="vcr-globe.svg" alt="VCR Records" width="320" height="240"/>
    </a>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="index.html#listen">Releases</a>
      <a href="artists.html" aria-current="page">Artists</a>
      <a href="merch.html">Merch</a>
    </nav>
    <div class="nav-end">
      <a href="cart.html" class="nav-cart" data-cart-link aria-label="Bag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M6 8h15l-1.4 8.4a2 2 0 0 1-2 1.6H9a2 2 0 0 1-2-1.6L5 4H2"/>
          <circle cx="10" cy="20" r="1.2" fill="currentColor" stroke="none"/>
          <circle cx="18" cy="20" r="1.2" fill="currentColor" stroke="none"/>
        </svg>
        <span class="nav-cart-count" data-cart-count hidden>0</span>
      </a>
      <button class="nav-ham" id="navHam" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
<div class="nav-drawer" id="navDrawer" aria-hidden="true">
  <a href="index.html">Home</a>
  <a href="index.html#listen">Releases</a>
  <a href="artists.html" aria-current="page">Artists</a>
  <a href="merch.html">Merch</a>
  <a href="cart.html">Bag</a>
</div>

<main class="page">
  <div class="band">
    <header class="intro">
      <p class="intro-brand">VCR Recordings</p>
      <h1>Artists</h1>
    </header>

    <section class="roster" aria-label="Roster">
      <!--
        Template — duplicate .artist for each artist:
        <article class="artist">
          <div class="artist-visual">
            <img src="COVER.jpg" alt="NAME" loading="eager"/>
          </div>
          <div class="artist-body">
            <div>
              <p class="artist-role">ROLE</p>
              <h2 class="artist-name">NAME</h2>
            </div>
            <p class="artist-bio">BIO / GENRE</p>
            <div class="artist-releases">
              <a class="chip" href="release.html">
                <img src="COVER.jpg" alt=""/>
                <span>Release</span>
              </a>
            </div>
            <div class="artist-actions">
              <a class="btn btn-dark" href="release.html">Latest release</a>
              <a class="btn btn-ghost" href="#" target="_blank" rel="noopener">Bandcamp</a>
            </div>
          </div>
        </article>
      -->
      <article class="artist in">
        <div class="artist-visual" aria-hidden="true"></div>
        <div class="artist-body">
          <div>
            <p class="artist-role"></p>
            <h2 class="artist-name"></h2>
          </div>
          <p class="artist-bio"></p>
          <div class="artist-releases"></div>
          <div class="artist-actions"></div>
        </div>
      </article>
    </section>
  </div>
</main>

<footer class="footer">
  <div class="band footer-bottom">
    <p class="footer-copy">© 2025 VCR Recordings</p>
    <div class="footer-links">
      <a href="index.html#listen">Releases</a>
      <a href="merch.html">Merch</a>
      <a href="https://vcrrecordings.bandcamp.com" target="_blank" rel="noopener">Bandcamp</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
</footer>

<script>
(function () {
  var nav = document.getElementById('nav');
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      nav.classList.toggle('scrolled', window.scrollY > 12);
      ticking = false;
    });
  }, { passive: true });
})();

var navHam = document.getElementById('navHam');
var navDrawer = document.getElementById('navDrawer');
navHam.addEventListener('click', function () {
  var open = navDrawer.classList.toggle('on');
  navHam.classList.toggle('on', open);
  navHam.setAttribute('aria-expanded', String(open));
  navDrawer.setAttribute('aria-hidden', String(!open));
});
navDrawer.querySelectorAll('a').forEach(function (a) {
  a.addEventListener('click', function () {
    navDrawer.classList.remove('on');
    navHam.classList.remove('on');
    navHam.setAttribute('aria-expanded', 'false');
    navDrawer.setAttribute('aria-hidden', 'true');
  });
});

var obs = new IntersectionObserver(function (entries) {
  entries.forEach(function (e) {
    if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); }
  });
}, { threshold: .12, rootMargin: '0px 0px -24px 0px' });
document.querySelectorAll('.artist').forEach(function (el) { obs.observe(el); });
</script>
<script src="js/cart.js"></script>
<script src="js/player.js"></script>
</body>
</html>
