<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1004 638" fill="none">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".72"/>
      <stop offset=".12" stop-color="#d7ebe2" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#8aa198" stop-opacity=".2"/>
      <stop offset="1" stop-color="#121816" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="lip" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset=".38" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".49" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="boss" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#f3f1ea"/>
      <stop offset=".45" stop-color="#9c9a92"/>
      <stop offset="1" stop-color="#2c2a26"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- back-wall thickness, only at the rim -->
  <rect x="10" y="12" width="988" height="620" rx="28" stroke="#141a18" stroke-opacity=".45" stroke-width="10"/>
  <rect x="6" y="6" width="992" height="626" rx="26" stroke="url(#lip)" stroke-width="7"/>

  <!-- front face rim  no center fill -->
  <rect x="3" y="3" width="998" height="632" rx="24" stroke="url(#rim)" stroke-width="3.2"/>
  <rect x="14" y="12" width="976" height="614" rx="18" stroke="#fff" stroke-opacity=".14" stroke-width="1.2"/>

  <!-- molded inner well -->
  <rect x="46" y="40" width="912" height="478" rx="10" stroke="#fff" stroke-opacity=".1" stroke-width="1.4"/>
  <rect x="50" y="44" width="904" height="470" rx="8" stroke="#000" stroke-opacity=".2" stroke-width="1"/>

  <!-- window frame -->
  <rect x="188" y="214" width="628" height="208" rx="8" stroke="#0b0d0c" stroke-opacity=".35" stroke-width="7"/>
  <rect x="194" y="220" width="616" height="196" rx="6" stroke="#eef6f1" stroke-opacity=".42" stroke-width="2.4"/>
  <rect x="198" y="224" width="608" height="188" rx="5" stroke="#000" stroke-opacity=".18" stroke-width="1"/>

  <!-- structural ribs -->
  <path d="M78 86 V486" stroke="#d7ebe2" stroke-opacity=".12" stroke-width="3"/>
  <path d="M926 86 V486" stroke="#d7ebe2" stroke-opacity=".12" stroke-width="3"/>
  <path d="M78 86 H200" stroke="#d7ebe2" stroke-opacity=".1" stroke-width="2"/>
  <path d="M926 86 H804" stroke="#d7ebe2" stroke-opacity=".1" stroke-width="2"/>
  <path d="M78 486 H200" stroke="#000" stroke-opacity=".16" stroke-width="2"/>
  <path d="M926 486 H804" stroke="#000" stroke-opacity=".16" stroke-width="2"/>

  <!-- screw wells -->
  <g fill="none">
    <g transform="translate(34 32)">
      <circle r="16" stroke="#000" stroke-opacity=".35" stroke-width="2"/>
      <circle r="13" stroke="#e8f2ec" stroke-opacity=".28" stroke-width="2"/>
      <circle r="7" fill="url(#boss)"/>
      <path d="M-4.2 0 H4.2 M0 -4.2 V4.2" stroke="#1a1a16" stroke-width="1.5"/>
    </g>
    <g transform="translate(970 32)">
      <circle r="16" stroke="#000" stroke-opacity=".35" stroke-width="2"/>
      <circle r="13" stroke="#e8f2ec" stroke-opacity=".28" stroke-width="2"/>
      <circle r="7" fill="url(#boss)"/>
      <path d="M-4.2 0 H4.2 M0 -4.2 V4.2" stroke="#1a1a16" stroke-width="1.5"/>
    </g>
    <g transform="translate(34 606)">
      <circle r="16" stroke="#000" stroke-opacity=".35" stroke-width="2"/>
      <circle r="13" stroke="#e8f2ec" stroke-opacity=".28" stroke-width="2"/>
      <circle r="7" fill="url(#boss)"/>
      <path d="M-4.2 0 H4.2 M0 -4.2 V4.2" stroke="#1a1a16" stroke-width="1.5"/>
    </g>
    <g transform="translate(970 606)">
      <circle r="16" stroke="#000" stroke-opacity=".35" stroke-width="2"/>
      <circle r="13" stroke="#e8f2ec" stroke-opacity=".28" stroke-width="2"/>
      <circle r="7" fill="url(#boss)"/>
      <path d="M-4.2 0 H4.2 M0 -4.2 V4.2" stroke="#1a1a16" stroke-width="1.5"/>
    </g>
    <g transform="translate(502 606)">
      <circle r="16" stroke="#000" stroke-opacity=".35" stroke-width="2"/>
      <circle r="13" stroke="#e8f2ec" stroke-opacity=".28" stroke-width="2"/>
      <circle r="7" fill="url(#boss)"/>
      <path d="M-4.2 0 H4.2 M0 -4.2 V4.2" stroke="#1a1a16" stroke-width="1.5"/>
    </g>
  </g>

  <!-- mouth housing -->
  <path d="M230 536 L774 536 L804 628 H200 Z" fill="#0a0c0b" fill-opacity=".22" stroke="#e8f2ec" stroke-opacity=".16"/>
  <path d="M248 548 L300 548 L312 622 H236 Z" fill="#050505"/>
  <path d="M328 548 L400 548 L412 622 H316 Z" fill="#050505"/>
  <path d="M428 548 L576 548 L588 622 H416 Z" fill="#050505"/>
  <path d="M604 548 L676 548 L688 622 H592 Z" fill="#050505"/>
  <path d="M704 548 L756 548 L768 622 H692 Z" fill="#050505"/>

  <!-- glass sheen -->
  <rect x="4" y="4" width="996" height="630" rx="24" fill="url(#sheen)" filter="url(#soft)"/>
</svg>
