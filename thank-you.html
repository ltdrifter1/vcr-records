<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Thank You — Club Copy</title>
  <link rel="icon" href="favicon.png" type="image/png"/>
  <link rel="apple-touch-icon" href="apple-touch-icon.png"/>
  <meta name="robots" content="noindex"/>
  <meta name="theme-color" content="#FAF8F5"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css"/>
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 28px; }
    .confirm {
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 56px 32px;
      text-align: center;
    }
    @media (min-width: 600px) { .confirm { padding: 64px 48px; } }
    .confirm h1 {
      font-size: clamp(34px, 6vw, 48px); font-weight: 600;
      letter-spacing: -.03em; line-height: 1.05; margin-bottom: 14px;
    }
    .confirm p {
      color: var(--muted); font-size: 16px;
      margin: 0 auto 16px; max-width: 32em; line-height: 1.55;
    }
    .confirm-note {
      font-size: 14px; color: var(--dim);
      margin: 0 auto 28px; max-width: 34em; line-height: 1.55;
    }
    .confirm-actions {
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    }
    .links { margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--line);
      display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
    .links a {
      color: var(--dim); font-size: 13px; font-weight: 500;
      letter-spacing: -.01em;
      padding: 6px 10px; border-radius: var(--pill);
      transition: color var(--dur) var(--ease), background var(--dur) var(--ease);
    }
    @media (hover:hover) { .links a:hover { background: var(--fill); color: var(--ink); } }
  </style>
</head>
<body>
  <main class="confirm">
    <a href="about.html"><img src="copy-house-publishing-logo.webp" alt="Copy House Publishing" width="1448" height="399" style="width:min(156px,44vw);height:auto;margin:0 auto 20px;display:block;opacity:.58"/></a>
    <h1>Thank you.</h1>
    <p id="msg">Your order is confirmed. A receipt is on its way from Stripe.</p>
    <p class="confirm-note" id="fulfillNote">
      Physical orders leave British Columbia in 2–4 business days with tracking.
      Cassettes include a download code in the parcel.
    </p>
    <div class="confirm-actions">
      <a class="btn btn-dark" href="library.html">Back to Library</a>
      <a class="btn btn-ghost" href="shipping.html">Shipping &amp; returns</a>
    </div>
    <div class="links">
      <a href="index.html#listen">Listen</a>
      <a href="merch.html">Shop</a>
      <a href="artists.html">Artists</a>
      <a href="contact.html">Contact</a>
    </div>
  </main>
  <script src="js/cart.js"></script>
  <script>
    if (window.VCRCart) VCRCart.clear();
    var sid = new URLSearchParams(location.search).get('session_id');
    if (sid) {
      document.getElementById('msg').textContent =
        'Your order is confirmed. Keep an eye on your inbox for the Stripe receipt.';
    }
  </script>
</body>
</html>
