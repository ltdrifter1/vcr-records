<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Thank You — Club Copy</title>
  <link rel="icon" href="favicon.png" type="image/png"/>
  <meta name="robots" content="noindex"/>
  <meta name="theme-color" content="#000000"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #ffffff;
      --muted: #a1a1a6;
      --dim: #6e6e73;
      --line: rgba(255,255,255,.1);
      --fill-hi: rgba(255,255,255,.08);
      --sans: 'Plus Jakarta Sans', sans-serif;
      --pill: 980px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans); background: var(--bg); color: var(--text);
      min-height: 100vh; display: grid; place-items: center; padding: 28px;
      background-image:
        radial-gradient(900px 480px at 80% -10%, rgba(255,255,255,.05), transparent 55%),
        linear-gradient(180deg, #000 0%, #0a0a0a 45%, #111 100%);
      -webkit-font-smoothing: antialiased;
      font-weight: 400; letter-spacing: -.011em;
    }
    a { color: inherit; text-decoration: none; }
    .card {
      width: min(520px, 100%);
      background: #141414;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 44px 28px;
      text-align: center;
    }
    .mark { width: min(200px, 64vw); margin: 0 auto 28px; height: auto; }
    h1 {
      font-size: clamp(32px, 6vw, 44px); font-weight: 600;
      letter-spacing: -.022em; line-height: 1.07; margin-bottom: 12px;
    }
    p {
      color: var(--muted); font-size: 17px; line-height: 1.47059;
      margin-bottom: 28px; max-width: 28em; margin-left: auto; margin-right: auto;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 46px; padding: 0 22px; border-radius: var(--pill);
      background: #fff; color: #000; font-size: 14px; font-weight: 500;
      letter-spacing: -.01em;
    }
    .links { margin-top: 20px; display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
    .links a {
      color: var(--dim); font-size: 13px; font-weight: 500;
      letter-spacing: -.01em;
      padding: 6px 10px; border-radius: var(--pill);
    }
    .links a:hover { background: var(--fill-hi); color: var(--text); }
  </style>
</head>
<body>
  <main class="card">
    <img class="mark" src="club-copy-header.png" alt="Club Copy" width="900" height="417"/>
    <h1>Thank you.</h1>
    <p id="msg">Your order is confirmed. A receipt is on its way from Stripe.</p>
    <a class="btn" href="merch.html">Back to merch</a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="index.html#listen">Listen</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html">Bag</a>
    </div>
  </main>
  <script src="js/cart.js"></script>
  <script>
    if (window.VCRCart) VCRCart.clear();
    var sid = new URLSearchParams(location.search).get('session_id');
    if (sid) {
      document.getElementById('msg').textContent =
        'Your order is confirmed. Keep an eye on your inbox for the Stripe receipt.';
    }
  </script>
</body>
</html>
