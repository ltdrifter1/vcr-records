<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Thank you — VCR Recordings</title>
  <meta name="robots" content="noindex"/>
  <meta name="theme-color" content="#f5f5f7"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73;
      --sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans); background: var(--bg); color: var(--text);
      min-height: 100vh; display: grid; place-items: center; padding: 28px;
      background-image:
        radial-gradient(700px 380px at 80% -10%, #fff, transparent 60%),
        linear-gradient(180deg, #eceef2, var(--bg) 45%);
    }
    .card {
      width: min(520px, 100%); background: #fff; border-radius: 24px;
      padding: 36px 28px; box-shadow: 0 18px 50px rgba(0,0,0,.08);
      text-align: center;
    }
    .mark { width: 96px; margin: 0 auto 22px; }
    h1 { font-size: 32px; letter-spacing: -.04em; margin-bottom: 10px; }
    p { color: var(--muted); line-height: 1.5; margin-bottom: 22px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 46px; padding: 0 20px; border-radius: 980px;
      background: #1d1d1f; color: #fff; text-decoration: none;
      font-size: 14px; font-weight: 600;
    }
    .links { margin-top: 16px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .links a { color: var(--muted); font-size: 13px; font-weight: 500; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <img class="mark" src="vcr-globe.svg" alt="VCR Recordings" width="320" height="240"/>
    <h1>Thank you</h1>
    <p id="msg">Your order is confirmed. A receipt is on its way from Stripe.</p>
    <a class="btn" href="merch.html">Back to merch</a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="index.html#listen">Listen</a>
      <a href="cart.html">Bag</a>
    </div>
  </main>
  <script src="js/cart.js"></script>
  <script>
    if (window.VCRCart) VCRCart.clear();
    var sid = new URLSearchParams(location.search).get('session_id');
    if (sid) {
      document.getElementById('msg').textContent =
        'Your order is confirmed. Keep an eye on your inbox for the Stripe receipt.';
    }
  </script>
</body>
</html>
