<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Club Copy — Underground Music for the Dedicated</title>
  <meta name="description" content="Club Copy — Y2K underground record label. Underground music for the dedicated. Est. 2024."/>
  <meta name="theme-color" content="#000000"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <link rel="icon" href="favicon.png" type="image/png"/>
  <link rel="apple-touch-icon" href="apple-touch-icon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/player.css"/>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --text: #ffffff;
      --muted: #cfcfcf;
      --dim: #757575;
      --ink: #1a1a1a;
      --line: rgba(255,255,255,.1);
      --fill: rgba(255,255,255,.04);
      --fill-hi: rgba(255,255,255,.08);
      --shadow: 0 2px 16px rgba(0,0,0,.35);
      --shadow-lg: 0 24px 60px rgba(0,0,0,.45);
      --radius: 18px;
      --pill: 980px;
      --ease: cubic-bezier(.22,1,.36,1);
      --dur: 320ms;
      --display: 'Chakra Petch', 'Syne', sans-serif;
      --sans: 'Syne', 'Chakra Petch', sans-serif;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --wrap: 1120px;
      --nav-h: 60px;
      --dock-h: 88px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      font-size: 17px;
      line-height: 1.47;
      letter-spacing: -.01em;
      padding-bottom: var(--safe-b);
      background-image:
        radial-gradient(900px 480px at 80% -10%, rgba(255,255,255,.06), transparent 55%),
        radial-gradient(700px 420px at 10% 20%, rgba(255,255,255,.03), transparent 50%),
        linear-gradient(180deg, #000 0%, #0a0a0a 40%, #111 100%);
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    button {
      font-family: inherit; cursor: pointer; border: none; background: none;
      -webkit-tap-highlight-color: transparent;
    }
    ::selection { background: rgba(255,255,255,.18); }

    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 300;
      height: calc(var(--nav-h) + var(--safe-t));
      padding-top: var(--safe-t);
      background: transparent;
      border-bottom: 1px solid transparent;
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), backdrop-filter var(--dur) var(--ease);
    }
    .nav.scrolled {
      background: rgba(0,0,0,.78);
      backdrop-filter: saturate(140%) blur(18px);
      -webkit-backdrop-filter: saturate(140%) blur(18px);
      border-bottom-color: var(--line);
    }
    .nav-inner {
      max-width: var(--wrap); margin: 0 auto; height: var(--nav-h);
      padding: 0 22px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .nav-logo img { height: 28px; width: auto; }
    @media (hover:hover) { .nav-logo:hover { opacity: .7; } }
    .nav-links { display: flex; gap: 2px; }
    .nav-links a {
      padding: 8px 12px; font-size: 12px; font-weight: 600; color: var(--muted);
      letter-spacing: .06em; text-transform: uppercase;
      border-radius: var(--pill);
      transition: color var(--dur) var(--ease), background var(--dur) var(--ease);
    }
    @media (hover:hover) { .nav-links a:hover { color: var(--text); background: var(--fill-hi); } }
    .nav-end { display: flex; align-items: center; gap: 4px; }
    .nav-cart {
      position: relative; width: 42px; height: 42px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--pill); color: var(--text);
    }
    @media (hover:hover) { .nav-cart:hover { background: var(--fill-hi); } }
    .nav-cart svg { width: 20px; height: 20px; }
    .nav-cart-count {
      position: absolute; top: 4px; right: 2px;
      min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: var(--pill); background: #fff; color: #000;
      font-size: 10px; font-weight: 700; line-height: 18px; text-align: center;
    }
    .nav-ham { display: none; flex-direction: column; gap: 5px; padding: 10px; }
    .nav-ham span {
      display: block; width: 16px; height: 1.5px; background: var(--muted);
      transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
    }
    .nav-ham.on span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); background: var(--text); }
    .nav-ham.on span:nth-child(2) { opacity: 0; }
    .nav-ham.on span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); background: var(--text); }
    @media (max-width: 680px) { .nav-links { display: none; } .nav-ham { display: flex; } }
    .nav-drawer {
      display: none; position: fixed;
      top: calc(var(--nav-h) + var(--safe-t)); left: 0; right: 0; z-index: 290;
      background: rgba(0,0,0,.94); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
      padding: 8px 22px calc(16px + var(--safe-b));
    }
    .nav-drawer.on { display: block; }
    .nav-drawer a {
      display: block; padding: 14px 0; border-bottom: 1px solid var(--line);
      font-size: 15px; font-weight: 600; color: var(--muted);
      letter-spacing: .04em; text-transform: uppercase;
    }
    .nav-drawer a:last-child { border-bottom: none; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 44px; padding: 0 20px; border-radius: var(--pill);
      font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      transition: opacity var(--dur) var(--ease), transform 180ms var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    .btn:active { transform: scale(.97); }
    .btn-dark { background: #fff; color: #000; }
    .btn-ghost {
      background: transparent; color: var(--text);
      border: 1px solid rgba(255,255,255,.28);
    }
    @media (hover:hover) {
      .btn-dark:hover { opacity: .88; }
      .btn-ghost:hover { background: var(--fill-hi); border-color: rgba(255,255,255,.5); }
    }

    /* HERO — clean premium chrome stage */
    .hero {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(ellipse 48% 34% at 50% 46%, rgba(255,255,255,.1), transparent 62%),
        radial-gradient(ellipse 70% 50% at 50% 100%, rgba(255,255,255,.04), transparent 55%);
      animation: haloPulse 8s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    .hero-stage {
      position: relative;
      z-index: 2;
      width: min(760px, calc(100% - 48px));
      padding: calc(var(--nav-h) + var(--safe-t) + 48px) 0 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 28px;
    }
    .hero-mark {
      width: min(560px, 82vw);
      margin: 0 auto;
      filter: drop-shadow(0 28px 60px rgba(0,0,0,.65));
      animation: markIn 1.05s var(--ease) both;
    }
    .hero-mark img {
      width: 100%;
      height: auto;
      animation: chromeShimmer 6s ease-in-out 1s infinite;
    }
    .hero-copy {
      max-width: 28rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: markIn 1.1s var(--ease) .16s both;
    }
    .hero-kicker {
      font-family: var(--display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--dim);
    }
    .hero-line {
      font-family: var(--display);
      font-size: clamp(17px, 2.6vw, 22px);
      font-weight: 600;
      font-style: italic;
      letter-spacing: .01em;
      color: var(--muted);
      line-height: 1.3;
    }
    .hero-ctas {
      display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
      animation: markIn 1.15s var(--ease) .28s both;
    }
    @keyframes markIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes chromeShimmer {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.1); }
    }
    @keyframes haloPulse {
      0%, 100% { opacity: .75; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero::before, .hero-mark, .hero-mark img, .hero-copy, .hero-ctas { animation: none; }
    }

    .band { max-width: var(--wrap); margin: 0 auto; padding: 0 22px; }

    .listen-head {
      padding: 48px 0 22px;
      max-width: 640px;
    }
    @media (min-width: 800px) { .listen-head { padding: 64px 0 28px; } }
    .listen-head .eyebrow {
      font-family: var(--display);
      font-size: 11px; font-weight: 600; letter-spacing: .22em;
      text-transform: uppercase; color: var(--dim); margin-bottom: 14px;
    }
    .listen-head h1 {
      font-family: var(--display);
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 700; font-style: italic; letter-spacing: -.02em; line-height: 1.05;
    }

    .listen-room {
      display: flex; flex-direction: column; gap: 22px;
      padding-bottom: 80px;
    }
    @media (min-width: 800px) { .listen-room { gap: 28px; padding-bottom: 110px; } }

    .listen-chapter {
      --chapter-h: 420px;
      display: grid;
      grid-template-columns: var(--chapter-h) minmax(0, 1fr);
      height: var(--chapter-h);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      overflow: hidden;
      box-shadow: var(--shadow);
      opacity: 0; transform: translateY(16px);
      transition: opacity .75s var(--ease), transform .75s var(--ease), box-shadow .4s var(--ease), border-color .4s var(--ease);
    }
    .listen-chapter.in { opacity: 1; transform: none; }
    @media (hover:hover) {
      .listen-chapter:hover { box-shadow: var(--shadow-lg); border-color: rgba(255,255,255,.2); }
    }
    @media (min-width: 861px) {
      .listen-chapter.is-flip .chapter-art { order: 2; }
    }
    @media (max-width: 860px) {
      .listen-chapter {
        --chapter-h: auto;
        grid-template-columns: 1fr;
        height: auto;
        max-height: none;
      }
    }
    .chapter-art {
      position: relative;
      width: 100%;
      height: 100%;
      background: #e8e8ed;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .chapter-art img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }
    @media (max-width: 860px) {
      .chapter-art {
        aspect-ratio: 1;
        width: min(100%, 420px);
        margin: 0 auto;
        height: auto;
      }
    }
    .chapter-body {
      padding: 22px 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }
    @media (min-width: 800px) {
      .chapter-body { padding: 28px 28px 22px; gap: 14px; }
    }
    @media (max-width: 860px) {
      .chapter-body {
        height: auto;
        max-height: 360px;
        overflow: hidden;
      }
    }
    .chapter-artist {
      font-family: var(--display);
      font-size: 11px; font-weight: 600; letter-spacing: .18em;
      text-transform: uppercase; color: var(--dim);
      flex-shrink: 0;
    }
    .chapter-title {
      font-family: var(--display);
      font-size: clamp(24px, 3.4vw, 34px);
      font-weight: 700; font-style: italic; letter-spacing: -.02em; line-height: 1.05;
      flex-shrink: 0;
    }
    .chapter-actions {
      display: flex; flex-wrap: wrap; gap: 8px;
      flex-shrink: 0;
    }

    .tracklist {
      display: flex;
      flex-direction: column;
      margin-top: 2px;
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,0,0,.25) transparent;
    }
    .tracklist::-webkit-scrollbar { width: 6px; }
    .tracklist::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,.22);
      border-radius: 999px;
    }
    .track {
      display: grid;
      grid-template-columns: 28px 34px 1fr auto;
      gap: 10px; align-items: center;
      width: 100%; text-align: left;
      padding: 11px 10px; margin: 0 -10px;
      border-radius: 14px;
      transition: background var(--dur) var(--ease);
    }
    @media (hover:hover) { .track:hover { background: var(--fill); } }
    .track.is-active { background: var(--fill-hi); }
    .track-num {
      font-size: 12px; font-weight: 600; color: var(--dim);
      font-variant-numeric: tabular-nums;
    }
    .track-play {
      width: 34px; height: 34px; border-radius: 50%;
      background: #fff; color: #000;
      display: inline-flex; align-items: center; justify-content: center;
      transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);
    }
    .track.is-external .track-play { background: var(--fill-hi); color: var(--text); }
    .track-play svg { width: 13px; height: 13px; fill: currentColor; }
    .track-play .i-ext { display: none; stroke: currentColor; fill: none; }
    .track.is-external .track-play .i-play { display: none; }
    .track.is-external .track-play .i-ext { display: block; }
    .track.is-playable .track-play .i-play { margin-left: 1px; fill: #000; }
    @media (hover:hover) { .track:hover .track-play { transform: scale(1.06); } }
    .track-title {
      font-size: 15px; font-weight: 550; letter-spacing: -.01em;
      color: var(--text);
    }
    .track.is-active .track-title { font-weight: 700; }
    .track-dur {
      font-size: 12px; font-weight: 500; color: var(--dim);
      font-variant-numeric: tabular-nums;
    }

    .footer {
      background: #000; border-top: 1px solid var(--line);
      padding: 56px 0 calc(28px + var(--safe-b));
    }
    .footer-top {
      display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 40px;
    }
    @media (max-width: 700px) { .footer-top { grid-template-columns: 1fr; } }
    .footer-logo { width: min(280px, 72vw); margin-bottom: 16px; }
    .footer-manifesto {
      font-family: var(--display);
      font-size: 20px; font-weight: 600; font-style: italic;
      letter-spacing: -.01em; line-height: 1.3; color: var(--muted);
    }
    .footer label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: .16em; text-transform: uppercase;
      color: var(--dim); margin-bottom: 10px;
    }
    .footer-form { display: flex; gap: 8px; }
    .footer-form input[type="email"] {
      flex: 1; height: 44px; border-radius: var(--pill); border: 1px solid var(--line);
      padding: 0 16px; background: var(--ink); color: var(--text); font: inherit;
    }
    .footer-form input[type="email"]::placeholder { color: var(--dim); }
    .footer-form button {
      height: 44px; padding: 0 18px; border-radius: var(--pill);
      background: #fff; color: #000; font-size: 12px; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
    }
    .footer-note { font-size: 12px; color: var(--dim); margin-top: 10px; }
    .footer-bottom {
      display: flex; flex-wrap: wrap; gap: 16px;
      justify-content: space-between; align-items: center;
    }
    .footer-copy { font-size: 12px; color: var(--dim); letter-spacing: .04em; }
    .footer-links { display: flex; flex-wrap: wrap; gap: 8px; }
    .footer-links a {
      font-size: 12px; font-weight: 600; color: var(--muted);
      padding: 6px 10px; border-radius: var(--pill);
      letter-spacing: .04em; text-transform: uppercase;
    }
    @media (hover:hover) { .footer-links a:hover { background: var(--fill-hi); color: var(--text); } }

    .rv.in { /* observed */ }
    @media (prefers-reduced-motion: reduce) {
      .listen-chapter { opacity: 1; transform: none; transition: none; }
    }
  </style>
</head>

<script>
(function () {
  var nav = document.getElementById('nav');
  var ticking = false;
  function syncNav() {
    nav.classList.toggle('scrolled', window.scrollY > 40);
    ticking = false;
  }
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(syncNav);
  }, { passive: true });
  syncNav();
})();

var navHam = document.getElementById('navHam');
var navDrawer = document.getElementById('navDrawer');
navHam.addEventListener('click', function () {
  var open = navDrawer.classList.toggle('on');
  navHam.classList.toggle('on', open);
  navHam.setAttribute('aria-expanded', String(open));
  navDrawer.setAttribute('aria-hidden', String(!open));
});
navDrawer.querySelectorAll('a').forEach(function (a) {
  a.addEventListener('click', function () {
    navDrawer.classList.remove('on');
    navHam.classList.remove('on');
    navHam.setAttribute('aria-expanded', 'false');
    navDrawer.setAttribute('aria-hidden', 'true');
  });
});

var obs = new IntersectionObserver(function (entries) {
  entries.forEach(function (e) {
    if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); }
  });
}, { threshold: .12, rootMargin: '0px 0px -40px 0px' });
document.querySelectorAll('.listen-chapter').forEach(function (el) { obs.observe(el); });

document.querySelectorAll('[data-external-url]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    window.open(btn.getAttribute('data-external-url'), '_blank', 'noopener');
  });
});

function syncActiveFromURL() {
  var params = new URLSearchParams(window.location.search);
  var track = params.get('t');
  document.querySelectorAll('.track.is-active').forEach(function (el) { el.classList.remove('is-active'); });
  if (!track) return;
  var btn = document.querySelector('.track[data-play-track="' + track + '"]');
  if (btn) btn.classList.add('is-active');
}
window.addEventListener('popstate', syncActiveFromURL);
document.querySelectorAll('[data-play-release]').forEach(function (el) {
  el.addEventListener('click', function () {
    setTimeout(syncActiveFromURL, 50);
  });
});
syncActiveFromURL();
</script>
