<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none" role="img" aria-label="VCR Records">
  <!-- 90s record-shop globe: screen-print offset, cel fills, confident ink -->
  <ellipse cx="146" cy="93" rx="108" ry="72" fill="#7dffb3" opacity="0.55"/>
  <ellipse cx="140" cy="88" rx="108" ry="72" fill="#ffe566" stroke="#0b1f18" stroke-width="4"/>
  <!-- highlight crescent -->
  <path d="M52 62 C66 38, 96 22, 128 19 C96 28, 70 44, 58 70 Z" fill="#fffdf2" opacity="0.9"/>
  <!-- Latitude -->
  <ellipse cx="140" cy="88" rx="108" ry="22" stroke="#0b1f18" stroke-width="2.2"/>
  <path d="M36 68 C80 58, 200 58, 244 68" stroke="#0b1f18" stroke-width="1.8" opacity=".6"/>
  <path d="M36 108 C80 118, 200 118, 244 108" stroke="#0b1f18" stroke-width="1.8" opacity=".6"/>
  <!-- Longitude -->
  <ellipse cx="140" cy="88" rx="36" ry="72" stroke="#0b1f18" stroke-width="2"/>
  <ellipse cx="140" cy="88" rx="72" ry="72" stroke="#0b1f18" stroke-width="1.8" opacity=".7"/>
  <line x1="140" y1="16" x2="140" y2="160" stroke="#0b1f18" stroke-width="2"/>
  <!-- VCR knockout bar -->
  <rect x="55" y="67" width="170" height="42" rx="4" fill="#0b1f18"/>
  <rect x="58" y="64" width="170" height="42" rx="4" fill="#fff" stroke="#0b1f18" stroke-width="3"/>
  <text x="143" y="95" text-anchor="middle" font-family="Manrope, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="0.06em" fill="#0b1f18">VCR</text>
  <!-- RECORDS -->
  <text x="140" y="186" text-anchor="middle" font-family="Manrope, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.42em" fill="#0b1f18">RECORDS</text>
</svg>
