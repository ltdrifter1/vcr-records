name: Sync video mixtapes

# Reads the public RSS feed of the L.T. Drifta YouTube channel into data/videos.json and
# rebuilds the home page, which lists the latest videos under "Video mixtapes". Runs daily
# and on demand; commits only when something changed, and Vercel redeploys from that commit.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 9 * * *"

permissions:
  contents: write

concurrency:
  group: sync-youtube-videos

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the channel feed
        run: node scripts/sync-youtube-videos.js
      - name: Rebuild the site
        run: node scripts/build-site.js
      - name: Commit if changed
        run: |
          git checkout -- sitemap.xml
          if git diff --quiet -- data/videos.json index.html; then
            echo "videos unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json index.html
          git commit -m "Video mixtapes: sync from YouTube"
          git push
